# Maquina con poca RAM: build austero (1 worker, heaps chicos).
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx900m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
