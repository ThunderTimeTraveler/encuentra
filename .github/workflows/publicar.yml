# Compila, firma y publica Encuentra en GitHub, sin que ninguna computadora
# necesite la llave: vive como secreto cifrado del repo (FIRMA_KEYSTORE_B64).
#
#   - Al subir una etiqueta vX.Y.Z  -> crea la release vX.Y.Z con el APK.
#   - A mano (Actions > Publicar > Run workflow) -> solo PRUEBA: compila y
#     comprueba la firma, sin publicar nada.
name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HUELLA: ff5bead462bfb4da481d87e4e9db532d5493c136c408ecf35a22be89b3d94615
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Llave de firma (desde el secreto)
        env:
          FIRMA: ${{ secrets.FIRMA_KEYSTORE_B64 }}
        run: |
          [ -n "$FIRMA" ] || { echo "Falta el secreto FIRMA_KEYSTORE_B64"; exit 1; }
          mkdir -p firma
          echo "$FIRMA" | base64 -d > firma/encuentra-firma.keystore
          cp keystore.properties.ejemplo keystore.properties

      - name: La etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con versionName $VERSION"; exit 1; }

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          TIENE=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          [ "$TIENE" = "$HUELLA" ] || { echo "Firmado con OTRA llave: $TIENE"; exit 1; }
          echo "Firma correcta"

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release.apk "Encuentra-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "Encuentra-$VERSION.apk" --title "Encuentra $VERSION" \
            --notes "Encuentra $VERSION. Se instala encima de la versión anterior. Requiere Android 11 o superior."
